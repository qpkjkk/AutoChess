plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rogic.autochess'
    compileSdk 35

    defaultConfig {
        applicationId "com.rogic.autochess"
        minSdk 26
        targetSdk 34
        versionCode 132
        versionName "3.4.25"
        ndk {
            // 只保留 arm64：省 ~57MB（x86/x86_64 so 对手机无用）；v7a 老机跑不动模型
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "autochess"
            keyAlias "autochess"
            keyPassword "autochess"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    androidResources {
        // NNUE 权重与 SVG 素材不压缩，assets 直读更快且避免超大压缩耗时
        noCompress 'nnue', 'svg', 'png', 'onnx', 'bin', 'tflite'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.github.bhlangonijr:chesslib:1.3.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
